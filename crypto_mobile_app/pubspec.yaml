name: crypto_mobile_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#0B1020"
  image: "assets/app_icon.png"
  android: true
  ios: true
  android_12:
    color: "#0B1020"
    image: "assets/app_icon.png"

